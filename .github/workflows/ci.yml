name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x']
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Syntax check
        run: node --check server.js
      - name: Smoke test (start server, health check)
        run: |
          node server.js > /tmp/wa.log 2>&1 &
          SRV=$!
          sleep 6
          curl -sf -m 5 http://localhost:3000/api/sessions
          RC=$?
          kill $SRV 2>/dev/null || true
          exit $RC
